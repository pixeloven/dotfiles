# A valid schema v1 settings file using every key, with neutral example values (docs/settings.md).
schemaVersion = 1

[[nfsShares]]
server = "nas.example.lan"
export = "/export/models"
mountPoint = "/var/mnt/nas/models"
mode = "ro"
cache = true

[[nfsShares]]
server = "192.0.2.10"
export = "/export/media"
mountPoint = "/var/mnt/nas/media"

[fscache]
dir = "/var/cache/fscache"
brun = 30
bcull = 25
bstop = 20
frun = 15
fcull = 10
fstop = 5

[comfyui]
root = "~/AI/ComfyUI"
modelsDirs = ["/var/mnt/nas/models", "~/models-extra"]
