# expect: nfsShares[0] (/var/mnt/nas/media) and nfsShares[1] (/var/mnt/nas/media/films): one mount point is inside the other
schemaVersion = 1
[[nfsShares]]
server = "nas.example.lan"
export = "/export/media"
mountPoint = "/var/mnt/nas/media"
[[nfsShares]]
server = "nas.example.lan"
export = "/export/films"
mountPoint = "/var/mnt/nas/media/films"
