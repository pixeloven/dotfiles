# The Linux dev box, for `distrobox assemble create --replace --file <this file>` on the host
# (RUNBOOK section 9). No `home` key: the box shares the host's $HOME, as distrobox always mounts it
# anyway. Tools go in the box's own Homebrew, never the host's. nvidia=true maps the host's NVIDIA
# driver in; chezmoi apply then adds the EGL and Vulkan manifests distrobox misses
# (lib/distrobox/nvidia-manifests.sh).
[ubuntu-dev]
image=docker.io/library/ubuntu:24.04
additional_packages="zsh build-essential procps curl file git"
init=false
nvidia=true
pull=true
