# Starship prompt — managed by chezmoi (~/Development/dotfiles). See CUSTOMIZE.md.
# All options: https://starship.rs/config/

"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = true
format = "$directory$git_branch$git_status$nodejs$python$cmd_duration$line_break$character"

[directory]
style = "bold mauve"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold peach"

[git_status]
style = "red"

# Node/Python versions show only inside a project that uses them (Starship's default detection).
[nodejs]
format = "[$symbol($version)]($style) "
style = "green"

[python]
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
style = "yellow"

[cmd_duration]
min_time = 2_000
format = "[took $duration]($style) "
style = "overlay1"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Catppuccin Mocha, from https://github.com/catppuccin/starship
[palettes.catppuccin_mocha]
