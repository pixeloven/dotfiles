name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install shellcheck chezmoi
      - name: shellcheck scripts and rendered chezmoi templates
        run: |
          shellcheck lib/*.sh bin/* home/dot_claude/hooks/*.sh .githooks/* home/.chezmoiscripts/*.sh
          for t in home/.chezmoiscripts/*.tmpl; do
            chezmoi --source "$PWD" execute-template < "$t" > "${RUNNER_TEMP}/$(basename "$t" .tmpl)"
            shellcheck "${RUNNER_TEMP}/$(basename "$t" .tmpl)"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y zsh
      - run: brew install bats-core jq gitleaks chezmoi starship
      # Tests tagged machine check the live install (Ghostty, herdr, ~/.gitconfig, ...).
      - run: bats --filter-tags '!machine' tests/

  secrets:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install gitleaks
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml
